name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, arch: x86, target: Windows-x86}
          - {os: windows-2022, arch: x64, target: Windows-x64}
          - {os: macos-15-intel, arch: x64, target: macOS-x64}
          - {os: macos-15, arch: arm64, target: macOS-arm64}
          - {os: ubuntu-22.04, arch: x64, target: Linux-x64}
          - {os: ubuntu-22.04-arm, arch: arm64, target: Linux-arm64}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libx11-6 libxext6 libxrender1 libfontconfig1
      - name: Test TCP and UDP
        run: python -m unittest -v test_network.py
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build and check app (Windows and macOS)
        if: runner.os != 'Linux'
        run: python scripts/build.py ${{ matrix.target }}
      - name: Build and check app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/build.py ${{ matrix.target }}
      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: TestTCP-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: TestTCP-*
          path: release
          merge-multiple: true
      - name: Publish version if new
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid VERSION'; exit 1; }
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo 'Tag must match VERSION'; exit 1
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists; leaving existing files unchanged."
            exit 0
          fi
          test "$(find release -type f | wc -l)" -eq 6
          (cd release && sha256sum * > SHA256SUMS.txt)
          gh release create "$tag" release/* --target "$GITHUB_SHA" --title "TestTCP $tag" --notes-file RELEASE_NOTES.md --draft
          gh release edit "$tag" --draft=false --latest
