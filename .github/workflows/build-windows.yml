name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: x64
      - name: Test TCP and UDP
        run: python -m unittest -v test_network.py
      - name: Check GUI
        run: python -c "import tkinter as tk; from app import App; root = tk.Tk(); app = App(root); root.update(); app.close()"
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name TestTCP app.py
      - name: Check executable startup
        shell: pwsh
        run: |
          $appProcess = Start-Process -FilePath .\dist\TestTCP.exe -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($appProcess.HasExited) {
              throw "TestTCP exited unexpectedly with code $($appProcess.ExitCode)"
            }
          } finally {
            if (-not $appProcess.HasExited) {
              Stop-Process -Id $appProcess.Id -Force
            }
          }
      - name: Upload Windows app
        uses: actions/upload-artifact@v7
        with:
          name: TestTCP-Windows-x64
          path: dist/TestTCP.exe
          if-no-files-found: error
          retention-days: 30
